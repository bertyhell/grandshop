[package]
name = "grandshop"
version = "0.13.0"
edition = "2024"
description = "Photo editing software for grandparents"
license = "MIT"
authors = ["Bert Verhelst <verhelstbert@gmail.com>", "Laurens Hellinger"]

[lib]
name = "grandshop"
path = "src/lib.rs"

[dependencies]
slint = "1.18"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "tiff", "webp", "bmp", "rayon"] }
fast_image_resize = { version = "6", features = ["image", "rayon"] }
imageproc = { version = "0.27", default-features = false, features = ["text"] }
ab_glyph = "0.2"
resvg = { version = "0.48", default-features = false }
rayon = "1"
include_dir = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Installers: `cargo packager --release` on each OS
# (Windows: NSIS setup .exe, macOS: .app and .dmg, Linux: .deb and AppImage)
[package.metadata.packager]
product-name = "Grandshop"
identifier = "com.grandshop.grandshop"
category = "GraphicsAndDesign"
before-packaging-command = "cargo build --release"
out-dir = "target/packages"
icons = ["assets/icons/icon.png", "assets/icons/icon.ico"]
formats = ["nsis", "app", "dmg", "deb", "appimage"]

[package.metadata.packager.deb]
depends = ["libfontconfig1", "libxkbcommon0"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
